[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
description = "Radar interno de oportunidades en la Shopify App Store"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "selectolax>=1.0",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:app"

[tool.setuptools]
packages = ["radar", "radar.stores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
